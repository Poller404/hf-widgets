<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uhr</title>
<style>
:root{--bg:#191919;--fg:rgba(255,255,255,.88);--mut:rgba(255,255,255,.38);--acc:#e16259}
:root[data-theme=light]{--bg:#ffffff;--fg:#37352f;--mut:rgba(55,53,47,.4)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden}
.w{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
svg{width:min(100%,calc(100vh - 90px),240px);aspect-ratio:1;height:auto}
.t{font-size:clamp(22px,13vw,34px);font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1}
.d{font-size:11px;color:var(--mut);letter-spacing:.05em;text-transform:uppercase;text-align:center;white-space:nowrap}
</style></head><body><div class="w">
<svg viewBox="0 0 200 200">
 <g id="ticks"></g>
 <line id="h" x1="100" y1="100" x2="100" y2="58" stroke="var(--fg)" stroke-width="4" stroke-linecap="round"/>
 <line id="m" x1="100" y1="100" x2="100" y2="30" stroke="var(--fg)" stroke-width="2.5" stroke-linecap="round"/>
 <line id="s" x1="100" y1="116" x2="100" y2="24" stroke="var(--acc)" stroke-width="1.2" stroke-linecap="round"/>
 <circle cx="100" cy="100" r="4" fill="var(--acc)"/>
</svg>
<div class="t" id="t">--:--</div>
<div class="d" id="d"></div>
</div>
<script src="theme.js"></script>
<script>
const g=document.getElementById('ticks'),NS='http://www.w3.org/2000/svg';
for(let i=0;i<60;i++){const a=i*Math.PI/30,big=i%5===0,r1=big?80:86,r2=92,l=document.createElementNS(NS,'line');
 l.setAttribute('x1',100+r1*Math.sin(a));l.setAttribute('y1',100-r1*Math.cos(a));l.setAttribute('x2',100+r2*Math.sin(a));l.setAttribute('y2',100-r2*Math.cos(a));
 l.setAttribute('stroke',big?'var(--fg)':'var(--mut)');l.setAttribute('stroke-width',big?2.4:1);l.setAttribute('stroke-linecap','round');g.appendChild(l);}
const rot=(id,deg)=>document.getElementById(id).setAttribute('transform','rotate('+deg+' 100 100)');
function tick(){const n=new Date(),s=n.getSeconds()+n.getMilliseconds()/1000,m=n.getMinutes()+s/60,h=(n.getHours()%12)+m/60;
 rot('s',s*6);rot('m',m*6);rot('h',h*30);
 document.getElementById('t').textContent=n.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});
 document.getElementById('d').textContent=n.toLocaleDateString('de-CH',{weekday:'short',day:'numeric',month:'short'});
 requestAnimationFrame(tick);}
tick();
</script></body></html>
